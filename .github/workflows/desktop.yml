# The desktop app (D42). Every PR checks the Rust shell; a v* tag (or a run by hand) builds the bundled server and the
# installers on Linux, Windows and macOS and attaches them to a draft GitHub Release. Builds are unsigned: no secrets.
name: desktop

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for the web view
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: A stand-in for the bundled server (the real one is built for releases)
        run: mkdir -p binaries && touch binaries/flowforge-server-x86_64-unknown-linux-gnu
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for the web view
        if: startsWith(matrix.platform, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build the dashboard
        run: npm ci && npm run build
        working-directory: frontend
      - name: Build and smoke-test the bundled server
        run: uv run python scripts/build_sidecar.py
      - name: Tauri's command line
        run: npm ci
        working-directory: desktop
      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "FlowForge ${{ github.ref_name }}"
          releaseBody: "Download the installer for your computer. These builds are unsigned: see the README's Desktop app section for the one-time Open anyway step."
          releaseDraft: true
      - name: Keep the installers (a run by hand)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: flowforge-desktop-${{ matrix.platform }}
          path: desktop/src-tauri/target/release/bundle/
