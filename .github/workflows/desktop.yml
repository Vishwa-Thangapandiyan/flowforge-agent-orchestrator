# The desktop app (D42). Every PR checks the Rust shell; a v* tag (or a run by hand) builds the bundled server and the
# installers on Linux, Windows and macOS and attaches them to a draft GitHub Release. Builds are unsigned: no secrets.
name: desktop

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for the web view
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: A stand-in for the bundled server (the real one is built for releases)
        run: mkdir -p binaries && touch binaries/flowforge-x86_64-unknown-linux-gnu
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for the web view
        if: startsWith(matrix.platform, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build the dashboard
        run: npm ci && npm run build
        working-directory: frontend
      - name: Build and smoke-test the bundled server
        run: uv run python scripts/build_sidecar.py
      - name: The same program for npx (D49)
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            ubuntu-*) name=flowforge-linux-x64 ;;
            windows-*) name=flowforge-windows-x64.exe ;;
            macos-14) name=flowforge-darwin-arm64 ;;
            macos-15-intel) name=flowforge-darwin-x64 ;;
          esac
          mkdir -p npx-dist
          cp desktop/src-tauri/binaries/flowforge-* "npx-dist/$name"   # the one program build_sidecar.py made
          echo "NPX_ASSET=$name" >> "$GITHUB_ENV"
      - name: Tauri's command line
        run: npm ci
        working-directory: desktop
      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "FlowForge ${{ github.ref_name }}"
          releaseBody: "Download the installer for your computer. These builds are unsigned: see the README's Desktop app section for the one-time Open anyway step."
          releaseDraft: true
      - name: Attach the npx program to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "npx-dist/$NPX_ASSET" --clobber
      - name: Keep the installers (a run by hand)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: flowforge-desktop-${{ matrix.platform }}
          path: desktop/src-tauri/target/release/bundle/

  publish:
    # All four programs are on the release: write their checksums and publish it, so `npx flowforge-map` can
    # download them (D49). The installers stay unsigned (D42); the release body says so.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checksums of the npx programs
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'flowforge-*'
          ls flowforge-linux-x64 flowforge-darwin-arm64 flowforge-darwin-x64 flowforge-windows-x64.exe
          sha256sum flowforge-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  npm:
    # The launcher, by npm trusted publishing: no token stored (D49). Its version must be the tag's.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The package's version is the tag's
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5+
      - run: npm publish --access public

  npx-smoke:
    # What a user types, on each system, once the package is out.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: npm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npx flowforge-map --version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in 1 2 3 4 5 6; do npm view "flowforge-map@$v" version && break; sleep 20; done   # the registry catches up
          out="$(npx -y "flowforge-map@$v" --version)"
          echo "$out"
          test "$out" = "flowforge $v"
