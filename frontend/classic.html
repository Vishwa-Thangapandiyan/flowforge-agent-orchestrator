<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowForge</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1c1d1f; --muted: #6b6f76; --line: #e3e3df;
    --accent: #3b5bdb; --accent-soft: #e7ecff;
    --pending: #c9ccd1; --ready: #f0b429; --running: #3b82f6; --ok: #2f9e44; --fail: #e03131; --skip: #adb5bd;
    --cp: #d9480f;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141517; --panel: #1c1d20; --ink: #e8e9eb; --muted: #9a9ea6; --line: #2e3035;
      --accent: #7c93ff; --accent-soft: #252b44;
      --pending: #4a4d54; --skip: #5c6068; --cp: #ff8a4c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
           padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0 12px 0 0; letter-spacing: .2px; }
  header label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  select, button, textarea { font: inherit; color: var(--ink); }
  select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 16px; cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 10px; }
  textarea { width: 100%; height: 360px; resize: vertical; background: var(--bg); border: 1px solid var(--line);
             border-radius: 6px; padding: 10px; font: 12px/1.5 var(--mono); }
  .msg { font-size: 13px; margin-top: 8px; min-height: 1.4em; }
  .msg.err { color: var(--fail); }
  .right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  #graphWrap { overflow-x: auto; }
  svg text { font-family: inherit; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .stat { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .paths { margin-top: 12px; font-size: 13px; }
  .paths div { margin: 4px 0; overflow-wrap: anywhere; }
  .paths code { font-family: var(--mono); font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  #log { font: 12px/1.6 var(--mono); max-height: 220px; overflow: auto; margin: 0; white-space: pre-wrap; color: var(--muted); }
  #detail pre { font: 12px/1.5 var(--mono); background: var(--bg); padding: 10px; border-radius: 6px;
                max-height: 280px; overflow: auto; white-space: pre-wrap; margin: 8px 0 0; }
  .hint { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>FlowForge</h1>
  <label>Example <select id="example"></select></label>
  <label>Policy
    <select id="policy">
      <option value="critical_path">critical path (FlowForge)</option>
      <option value="fifo">FIFO</option>
      <option value="levels">level by level</option>
      <option value="greedy">greedy (unlimited)</option>
      <option value="sequential">sequential</option>
    </select>
  </label>
  <label><input type="checkbox" id="cache" checked> cache</label>
  <button id="run">Run</button>
</header>

<main>
  <section class="panel">
    <h2>Workflow JSON</h2>
    <textarea id="json" spellcheck="false"></textarea>
    <div id="msg" class="msg"></div>
  </section>

  <div class="right">
    <section class="panel">
      <h2>Graph</h2>
      <div class="legend">
        <span><i style="background:var(--pending)"></i>pending</span>
        <span><i style="background:var(--ready)"></i>ready</span>
        <span><i style="background:var(--running)"></i>running</span>
        <span><i style="background:var(--ok)"></i>succeeded</span>
        <span><i style="background:var(--fail)"></i>failed</span>
        <span><i style="background:var(--skip)"></i>skipped</span>
        <span><i style="background:var(--cp)"></i>critical path</span>
      </div>
      <div id="graphWrap"><svg id="graph" role="img" aria-label="Workflow graph"></svg></div>
    </section>

    <section class="panel">
      <h2>Run</h2>
      <div class="stats">
        <div class="stat"><b id="sStatus">—</b><span>status</span></div>
        <div class="stat"><b id="sMakespan">—</b><span>makespan</span></div>
        <div class="stat"><b id="sCalls">—</b><span>API calls</span></div>
        <div class="stat"><b id="sHits">—</b><span>cache hits</span></div>
      </div>
      <div class="paths">
        <div>Predicted critical path: <code id="pPred">—</code></div>
        <div>Actual critical path: <code id="pAct">—</code></div>
      </div>
    </section>

    <section class="panel" id="detail">
      <h2>Step</h2>
      <div class="hint">Click a step in the graph to see its output.</div>
    </section>

    <section class="panel">
      <h2>Events</h2>
      <pre id="log"></pre>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const NODE_W = 188, NODE_H = 46, COL_GAP = 64, ROW_GAP = 16, PAD = 12;
const STATE_COLOR = { pending: "--pending", ready: "--ready", running: "--running",
                      succeeded: "--ok", failed: "--fail", skipped: "--skip" };

let plan = null;          // /validate response for the current JSON
let workflow = null;      // parsed JSON
let steps = {};           // step id → {state, duration_ms, cache_hit, error}
let criticalPath = [];
let source = null;

function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function fmtMs(ms) { return ms >= 1000 ? (ms / 1000).toFixed(2) + " s" : Math.round(ms) + " ms"; }

async function loadExamples() {
  const names = await (await fetch("/workflows")).json();
  $("example").innerHTML = names.map((n) => `<option>${n}</option>`).join("");
  const preferred = names.includes("diamond_mock") ? "diamond_mock" : names[0];
  $("example").value = preferred;
  await loadExample(preferred);
}

async function loadExample(name) {
  const wf = await (await fetch(`/workflows/${name}`)).json();
  $("json").value = JSON.stringify(wf, null, 2);
  await validate();
}

async function validate() {
  const msg = $("msg");
  try { workflow = JSON.parse($("json").value); }
  catch (e) { msg.className = "msg err"; msg.textContent = "Invalid JSON: " + e.message; $("run").disabled = true; return false; }
  const res = await fetch("/validate", { method: "POST", headers: { "content-type": "application/json" },
                                         body: JSON.stringify(workflow) });
  const body = await res.json();
  if (!res.ok) {
    msg.className = "msg err";
    msg.textContent = typeof body.detail === "string" ? body.detail
      : body.detail.map((d) => `${d.loc.slice(1).join(".")}: ${d.msg}`).join("\n");
    $("run").disabled = true;
    return false;
  }
  plan = body;
  criticalPath = body.critical_path;
  msg.className = "msg";
  msg.textContent = `${body.order.length} steps · ${body.levels.length} levels · predicted critical path ${fmtMs(body.critical_path_ms)}`;
  $("run").disabled = false;
  steps = Object.fromEntries(body.order.map((id) => [id, { state: "pending" }]));
  $("pPred").textContent = body.critical_path.join(" → ");
  draw();
  return true;
}

function layout() {
  const pos = {};
  plan.levels.forEach((level, col) => level.forEach((id, row) => {
    pos[id] = { x: PAD + col * (NODE_W + COL_GAP), y: PAD + row * (NODE_H + ROW_GAP) };
  }));
  return pos;
}

function draw() {
  if (!plan) return;
  const svg = $("graph"), pos = layout();
  const w = PAD * 2 + plan.levels.length * NODE_W + (plan.levels.length - 1) * COL_GAP;
  const h = PAD * 2 + Math.max(...plan.levels.map((l) => l.length)) * (NODE_H + ROW_GAP) - ROW_GAP;
  svg.setAttribute("width", w); svg.setAttribute("height", h); svg.setAttribute("viewBox", `0 0 ${w} ${h}`);

  const onCp = new Set(criticalPath.slice(1).map((id, i) => criticalPath[i] + ">" + id));
  const typeOf = Object.fromEntries(workflow.steps.map((s) => [s.id, s.type]));
  let out = "";
  for (const s of workflow.steps) for (const p of s.depends_on || []) {
    const a = pos[p], b = pos[s.id], cp = onCp.has(p + ">" + s.id);
    const x1 = a.x + NODE_W, y1 = a.y + NODE_H / 2, x2 = b.x, y2 = b.y + NODE_H / 2, mx = (x1 + x2) / 2;
    out += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none"
             stroke="${cp ? css("--cp") : css("--line")}" stroke-width="${cp ? 2.5 : 1.5}"/>`;
  }
  for (const id of plan.order) {
    const { x, y } = pos[id], st = steps[id] || { state: "pending" };
    const color = css(STATE_COLOR[st.state] || "--pending");
    const cp = criticalPath.includes(id);
    const sub = st.state === "succeeded" ? fmtMs(st.duration_ms || 0) + (st.cache_hit ? " · cache hit" : "")
              : st.state === "failed" ? "failed" : st.state === "skipped" ? "skipped" : typeOf[id];
    out += `<g data-id="${id}" style="cursor:pointer">
      <rect x="${x}" y="${y}" width="${NODE_W}" height="${NODE_H}" rx="8" fill="${css("--panel")}"
            stroke="${cp ? css("--cp") : css("--line")}" stroke-width="${cp ? 2 : 1}"/>
      <rect x="${x}" y="${y}" width="6" height="${NODE_H}" rx="3" fill="${color}"/>
      <text x="${x + 14}" y="${y + 19}" font-size="12.5" font-weight="600" fill="${css("--ink")}">${clip(id, 24)}</text>
      <text x="${x + 14}" y="${y + 35}" font-size="11.5" fill="${css("--muted")}">${sub}</text>
    </g>`;
  }
  svg.innerHTML = out;
  svg.querySelectorAll("g[data-id]").forEach((g) => g.addEventListener("click", () => showStep(g.dataset.id)));
}

function clip(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]); }

let lastResult = null;
function showStep(id) {
  const st = steps[id] || {}, res = lastResult?.steps?.[id];
  const body = res?.error ? "Error: " + res.error
             : res?.output !== undefined && res?.output !== null ? JSON.stringify(res.output, null, 2)
             : "No output yet.";
  $("detail").innerHTML = `<h2>Step · ${esc(id)}</h2>
    <div class="hint">${esc(st.state || "pending")}${res ? ` · ${res.attempts} attempt(s)` : ""}${st.cache_hit ? " · cache hit" : ""}</div>
    <pre>${esc(body.length > 6000 ? body.slice(0, 6000) + "\n…" : body)}</pre>`;
}

function log(line) { const el = $("log"); el.textContent += line + "\n"; el.scrollTop = el.scrollHeight; }

async function run() {
  if (!(await validate())) return;
  if (source) source.close();
  lastResult = null;
  $("log").textContent = "";
  ["sStatus", "sMakespan", "sCalls", "sHits"].forEach((k) => ($(k).textContent = "—"));
  $("sStatus").textContent = "running";
  $("pAct").textContent = "—";
  $("run").disabled = true;

  const params = new URLSearchParams({ policy: $("policy").value, use_cache: $("cache").checked });
  const res = await fetch(`/runs?${params}`, { method: "POST", headers: { "content-type": "application/json" },
                                              body: JSON.stringify(workflow) });
  const { run_id } = await res.json();

  source = new EventSource(`/runs/${run_id}/events`);
  source.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === "step") {
      steps[ev.step_id] = { ...steps[ev.step_id], ...ev };
      log(`${ev.t.toFixed(3)}s  ${ev.step_id} → ${ev.state}${ev.cache_hit ? " (cache hit)" : ""}${ev.error ? "  " + ev.error : ""}${ev.reason ? "  " + ev.reason : ""}`);
      draw();
    } else if (ev.type === "retry") {
      log(`${ev.t.toFixed(3)}s  ${ev.step_id} retry #${ev.attempt} in ${ev.delay_s}s  (${ev.error})`);
    } else if (ev.type === "run") {
      log(`${ev.t.toFixed(3)}s  run ${ev.state}`);
    }
  };
  source.addEventListener("end", async () => {
    source.close();
    const status = await (await fetch(`/runs/${run_id}`)).json();
    lastResult = status.result;
    $("sStatus").textContent = status.status;
    if (lastResult) {
      $("sMakespan").textContent = fmtMs(lastResult.makespan_ms);
      $("sCalls").textContent = lastResult.api_calls;
      $("sHits").textContent = lastResult.cache_hits;
      $("pAct").textContent = lastResult.actual_critical_path.join(" → ");
      criticalPath = lastResult.actual_critical_path;
      draw();
    }
    $("run").disabled = false;
  });
}

let debounce;
$("json").addEventListener("input", () => { clearTimeout(debounce); debounce = setTimeout(validate, 400); });
$("example").addEventListener("change", (e) => loadExample(e.target.value));
$("run").addEventListener("click", run);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
loadExamples();
</script>
</body>
</html>
