[project]
name = "flowforge"
version = "0.1.0"
description = "The scheduler layer for agent workflows: runs LLM, MCP and HTTP steps as a DAG, critical path first"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "openai>=1.40",
    "mcp>=1.2",
    "python-dotenv>=1.0",
    "anthropic>=1.11.0",
    "jsonschema>=4.26.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
flowforge = "flowforge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/flowforge"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "UP042",  # StepState(str, Enum) → StrEnum would change str(state); not a lint-only change
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E501", "B905"]  # long assertion/data lines read better whole
"backend/flowforge/flowmap/fixture.py" = ["E501"]  # example data: one block or line per row
"backend/flowforge/connectors/presets.py" = ["E501"]  # catalog rows read better whole
